[package]
name = "asclepius"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Atlas biological-response and treatment-outcome model foundation"
repository.workspace = true
license.workspace = true
readme = "../../README.md"
keywords = ["biophysics", "radiobiology", "thermal-dose", "treatment-response"]
categories = ["no-std", "science"]
publish = true

[dependencies]
aequitas = { version = "0.2.1", git = "https://github.com/ryancinsight/aequitas", default-features = false }
eunomia = { version = "0.9.0", git = "https://github.com/ryancinsight/eunomia", default-features = false }

[dev-dependencies]
mnemosyne = { package = "mnemosyne-memory", version = "0.9.0", git = "https://github.com/ryancinsight/Mnemosyne", default-features = false }
proptest = "1.11.0"

[features]
default = ["std"]
std = ["aequitas/std", "eunomia/std"]

[lints]
workspace = true
