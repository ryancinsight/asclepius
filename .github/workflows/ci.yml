name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Guards the one artifact whose correctness cannot be checked from inside the
  # overlay environment that produces it. Calls the shared Atlas workflow.
  lockfile:
    name: Lockfile integrity
    uses: ryancinsight/atlas/.github/workflows/lockfile-guard.yml@886d85b0e4bea20c8e5ec4b4239e6ba9cdbcf74d
    permissions:
      contents: read

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b
        with:
          components: clippy,rustfmt
      - uses: taiki-e/install-action@ea4c0b50b0d394ee91c5bb68a6a295b0556feb8e
      - run: cargo fmt --check
      - run: cargo check --locked --workspace --all-features
      - run: cargo check --locked -p asclepius --no-default-features
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo nextest run --locked --workspace --all-features
      - run: cargo test --locked --doc --workspace --all-features
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps --all-features

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    env:
      # The install step sets a rustup *default*; the committed rust-toolchain.toml
      # outranks it, so without this the job compiled with the pinned channel.
      RUSTUP_TOOLCHAIN: 1.95.0
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b
        with:
          toolchain: 1.95.0
      - name: Prove the toolchain under test
        run: rustc --version && cargo --version
      - name: Build at declared MSRV
        run: cargo check --locked --workspace --all-targets --all-features

  # Public-surface compatibility through the stack's one gate, replacing
  # the hand-rolled job this repository carried before the shared
  # workflow existed: a divergent per-repo copy is the duplication
  # defect ADR 0035 exists to prevent.
  # Atlas ATLAS-SEMVER-GATE-FLEETWIDE-2026-08-28.
  semver:
    name: SemVer gate
    uses: ryancinsight/atlas/.github/workflows/semver-gate.yml@466b47a9a604bc9c91d4848f0b6c1df36a2bd5c2
    with:
      package: asclepius
      rust-toolchain: 1.97.0
    permissions:
      contents: read

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b
      - uses: taiki-e/install-action@d723d4e98d0acebf58d7d110a3750a9a0c1931cd
      - run: cargo deny check
